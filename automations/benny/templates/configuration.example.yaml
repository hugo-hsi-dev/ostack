schema_version: 1

routines:
  triage_name: "benny-triage"
  reproduce_name: "benny-reproduce"

# Routines have no Slack trigger. "schedule" scans the source channel each run.
# "api" reads the report coordinates from the routine-fire-payload text.
trigger:
  type: "schedule"
  schedule: "hourly"
  scan_lookback_hours: 24
  triage_max_reports_per_run: 5
  reproduce_max_reports_per_run: 1

slack:
  source_channel_id: "SOURCE_CHANNEL_ID"
  operations_channel_id: ""
  triage_identity_user_id: "TRIAGE_IDENTITY_USER_ID"
  read_action: "configured-slack-connector-read-tool"
  thread_post_action: "configured-slack-connector-thread-reply-tool"
  reaction_action: "configured-slack-connector-reaction-tool"
  file_download_action: "configured-slack-connector-file-download-tool"
  operations_edit_action: "configured-slack-connector-edit-tool"
  prefer_connector_tools: true
  optional_bot_token_env: "BENNY_SLACK_BOT_TOKEN"
  allow_source_root_posts: false
  allow_worker_slack_writes: false

repository:
  url: "https://github.com/example-org/example-repo"
  default_branch: "main"
  pull_request_action: "configured-draft-pull-request-action"
  pull_request_url_format: "https://github.com/{owner}/{repo}/pull/{number}"
  draft_only: true

tracker:
  type: "linear"
  adapter_skill_name: "issue-tracker-adapter-placeholder"
  team: "team-placeholder"
  project: "project-placeholder"
  labels:
    bug: "bug-label-placeholder"
    performance: "performance-label-placeholder"
    intake: "intake-label-placeholder"
    needs_repro: "needs-repro-label-placeholder"
  status: "intake-status-placeholder"
  source_link_title: "Slack report"
  require_compensation_action: true

routing:
  map_path: ".claude/benny/routing.md"
  owner_pings_default: false
  allow_feature_owner_ping: false
  allow_confirmed_regression_author_ping: false

control:
  skill_name: "control-target-app"
  feature_map_path: ".claude/benny/feature-map.md"
  environment: "safe-test-environment-placeholder"
  artifact_directory: "/tmp/benny-artifacts"
  artifact_retention_hours: 24

verdict_markers:
  bug: "[benny:bug]"
  performance: "[benny:performance]"
  other: "[benny:other]"
  tracker_attribute: "tracker"

status_emoji:
  seen: "👀"
  reproducing: "🔎"
  reproduced: "✅"
  could_not_reproduce: "⚪"
  blocked: "⛔"
  fixing: "🛠️"
  fix_failed: "❌"
  pull_request_opened: "🔗"

budgets:
  poll_seconds: 45
  verdict_wait_minutes: 45
  triage_follow_up_minutes: 10
  triage_total_minutes: 30
  repro_minutes: 60
  rejection_window_minutes: 10
  fix_minutes: 90
  operations_follow_up_minutes: 45

# The routine form sets each run's model, so pick `triage` and `reproduce` there.
# `code` and `media_review` go to subagents as the Agent tool's `model`.
# Write "<model> <effort>", such as "opus xhigh", to pass an `effort` too.
models:
  triage: "opus"
  reproduce: "opus"
  code: "sonnet"
  media_review: "opus"
