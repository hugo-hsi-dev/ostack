name: ci

on:
  push:
    branches: [main, codex, 'codex/**']
  pull_request:

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Managed installation regression tests
        run: python3 -m unittest discover -s tests
      - name: Sync product-selection regression tests
        run: python3 -m unittest discover -s sync/tests
      - name: Upstream plus reviewed patches
        run: python3 sync/sync.py check
      - name: Codex metadata and compatibility boundaries
        run: python3 sync/validate_codex.py
      - name: Shell syntax
        run: bash -n skills/onyo-mode/scripts/worktree-audit.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install pinned workflow test dependencies
        working-directory: skills/onyo-mode/scripts
        run: bun install --frozen-lockfile
      - name: Workflow tests and types
        working-directory: skills/onyo-mode/scripts
        run: |
          bun run test
          bun run typecheck
      - name: Statechart tests (TLC-dependent cases skip without TLC)
        run: node --test skills/statechart/scripts/test/statechart.test.mjs
