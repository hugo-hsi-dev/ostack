name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pstack-origin files match upstream plus sync/patches
        run: python3 sync/sync.py check
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: onyo-mode hook test
        run: sh hooks/onyo-mode.test.sh
      - name: coordinator turn replay test
        run: sh hooks/replay.test.sh
