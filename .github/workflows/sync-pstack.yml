name: sync-pstack

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-pstack
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump to the newest pstack and merge when mechanical
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh sync/auto-sync.sh
